name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (the version is in the comment) so a
      # moved or compromised tag cannot change what runs in CI. Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      # requirements.txt is compiled from requirements.in with --generate-hashes, so pip
      # runs in hash-checking mode and refuses anything that is not the pinned artefact.
      - run: python -m pip install -r requirements.txt
      - name: Audit pinned dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict --require-hashes --progress-spinner off -r requirements.txt
      - run: python -m pytest tests -q
